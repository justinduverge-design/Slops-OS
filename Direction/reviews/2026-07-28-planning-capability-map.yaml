# Slops OS — Planning Capability Map (machine-readable companion)
# Created:  2026-07-28 by Claude (Cowork), Planning System Architecture Audit
# Revised:  2026-07-29 — correction + founder-response pass (revision 2)
# Prose:    Direction/reviews/2026-07-28-planning-architecture-audit.md
#
# STATUS: evidence + proposal. Per Direction/reviews/README.md, reviews are evidence, not authority.
# Nothing here has been applied. Verdicts are RECOMMENDATIONS. Founder approval status is in
# `approval_status` below and in §13 of the prose audit. Several verdicts are explicitly NOT APPROVED.
#
# REVISION 2 CHANGES
#   - verdict counts reconciled to a reproducible, machine-derivable basis (see counting_method)
#   - every top-level record now carries all 10 required fields (value / [] / unknown / not_applicable)
#   - records typed as `artifact` or `aggregate`; aggregates are NOT individual artifact records
#   - §1.2 skills evidence re-derived (invocation-column parsing, not substring matching)
#   - §4.2 worktree "prunable" finding WITHDRAWN as a sandbox artifact
#   - §5.2 propagation restated as a 3-case tested pattern, not a proven law
#   - claims withdrawn are recorded in `withdrawn_claims`

schema_version: 2
created: 2026-07-28
revised: 2026-07-29
audit_doc: Direction/reviews/2026-07-28-planning-architecture-audit.md

# ---------------------------------------------------------------------------
# LEGEND
# ---------------------------------------------------------------------------
legend:
  record_type:
    artifact:  A single addressable artifact. Carries meaningful artifact-level fields.
    aggregate: A named collection counted as ONE record. Artifact-level fields describe the
               collection, not any single member. NOT an individual artifact record.
  verdict:
    KEEP:   working as designed; do not touch
    MODIFY: keep the artifact, change its content or wiring
    MERGE:  fold into another artifact
    RETIRE: remove from the live surface
    CREATE: new artifact required (must justify why orchestration cannot suffice)
  invocation_kind:
    mechanical: a script, gate, or predicate triggers it
    documented: a written rule says when to use it
    tribal:     nothing written; depends on the operator remembering
    none:       nothing invokes it
  health:
    healthy | degraded | broken | dormant
  field_conventions:
    - "[] means the field genuinely has no entries"
    - "unknown means the audit did not establish it"
    - "not_applicable means the field does not apply to this record type"

# ---------------------------------------------------------------------------
# COUNTING METHOD — the human-readable totals must be reproducible from this file
# ---------------------------------------------------------------------------
counting_method:
  primary_basis: >
    One count per top-level record under `artifacts:` that carries a `verdict` key.
    Both `artifact` and `aggregate` records count as exactly ONE each.
    This is the number quoted in the prose audit §2.
  reproduce_with: |
    python3 -c "
    import yaml,collections
    d=yaml.safe_load(open('2026-07-28-planning-capability-map.yaml'))
    print(collections.Counter(a['verdict'] for a in d['artifacts'] if 'verdict' in a))
    print('records:', len(d['artifacts']))
    print('CREATE:', len(d['create_recommendations']))"
  note_on_revision_1: >
    Revision 1's prose totals (KEEP 21 / MODIFY 18 / MERGE 9 / RETIRE 24 / CREATE 1 = 73) were
    counted at the level of underlying items — expanding aggregates such as the 20 never-used
    skills into 20 separate RETIRE verdicts — while the YAML carried them as single grouped
    records. The two could not be reconciled. Revision 2 uses the record basis in both files and
    reports the expanded figure separately below, with its expansion documented per record.

