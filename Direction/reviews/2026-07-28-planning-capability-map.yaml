  local_main_behind_origin: 20        # CONFIRMED DEFECT — checkout is not current

  skills_on_disk_L0: 52               # dirs with SKILL.md, excluding _template and _proposals
  skill_ledger_data_rows: 345
  skill_invocation_records: 622       # names in the Skill column only
  skill_skipped_records: 5
  skills_zero_ledger_records: 23      # corrected from 20 in revision 1
  skills_zero_records_but_correctly_parked: 2
  skills_registry_only_genuine_defect: 2   # design-quality-bar, ux-ui-build-pipeline
  phantom_ledger_skills: 2            # slops-deploy-guard (13), jules-react-component (11)

  routing_table_status_field: well-formed    # WITHDRAWN claim that it does not parse
  routing_status_distribution: {active: 53, parked: 2, retired: 1, paired-with: 1}

  decision_stores: 4
  decision_stores_with_status_field: 1       # only the abandoned ADR folder
  decision_stores_with_stable_ids: 1         # only the abandoned ADR folder
  structured_governance_control_maps: 1      # omen/probo.yaml — NARROWED claim, see legend below
  competing_agent_wrapper_sets: 3

  worktrees_registered: 11
  worktrees_fully_merged_into_origin_main: 7
  worktrees_patch_duplicate: 1
  worktrees_holding_unique_work: 2           # 6 unique commits total
  worktree_prunable_flag: sandbox-artifact-not-a-defect

  total_records: 54
  records_by_type: {artifact: 36, aggregate: 18}

  verdict_counts_basis: one-per-top-level-record
  verdict_counts: {KEEP: 12, MODIFY: 31, MERGE: 4, RETIRE: 7, CREATE: 0}
  verdict_counts_note: >
    Sums to 54, the record count. CREATE is 0 within `artifacts:` by design — the single CREATE
    recommendation lives in `create_recommendations:` and is counted there. THIS is the basis the
    prose audit §2 quotes. Verified by the reproduce_with snippet above on 2026-07-29.

  verdict_counts_expanded: {KEEP: 60, MODIFY: 59, MERGE: 14, RETIRE: 89, CREATE: 1}
  verdict_counts_expanded_method: >
    Each aggregate record contributes its `expansion_count` instead of 1; artifact records
    contribute 1. Reproduce by summing expansion_count where record_type == aggregate.
  verdict_counts_expanded_caveat: >
    USE WITH CARE. The expanded figure is mechanically correct but weakly meaningful, because a
    few large collections dominate it: L2.audits (43 files, one RETIRE decision) drives most of
    the RETIRE total, and L2.reviews (44 files, one KEEP decision) drives most of KEEP. Retiring
    the abandoned audits folder is ONE decision about 43 files, not 43 decisions. The record basis
    is the honest summary; this figure exists only so the two counting bases are both reproducible.

# ---------------------------------------------------------------------------
# CLAIMS WITHDRAWN IN REVISION 2
# ---------------------------------------------------------------------------
withdrawn_claims:
  - id: CHG-01
    revision_1_claim: "10 prunable git worktrees — repository rot; prune all 10 plus 5 orphans."
    why_wrong: >
      `prunable` was reported because the worktree admin files record Windows absolute paths
      (C:/Users/JDuve/...) which do not resolve inside this Linux audit sandbox. The directories
      exist on disk. On Windows git would very likely not flag them. Running the recommended
      prune from this sandbox would have destroyed all 11 admin records.
    status: WITHDRAWN
    replaced_by: A safety table computed against origin/main, plus an explicit uncertainty note.

  - id: CHG-02a
    revision_1_claim: "5 skills routed but absent from L0."
    why_wrong: >
      slops-markdown-authoring is routed with Status `retired` and is correctly absent.
      slops-content-ship and slops-voiceover are routed with the Layer column explicitly reading
      "Layer 2 (Omen-local: slops-saloon/omen/Blueprints/skills/...)" and exist exactly there.
    status: CORRECTED
    corrected_to: 2 genuine registry-only defects (design-quality-bar, ux-ui-build-pipeline).

  - id: CHG-02b
    revision_1_claim: "The routing table does not distinguish product-local skills."
    why_wrong: The Layer column names the exact Omen-local path for both product-local skills.
    status: WITHDRAWN

  - id: CHG-02c
    revision_1_claim: "The Status column does not parse as a consistent enumerated field."
    why_wrong: >
      It has a documented legend and parses cleanly into active / parked:<gate> /
      retired:<date> / paired-with:<name> / proposed. The audit's parser was wrong, not the file.
    status: WITHDRAWN

  - id: CHG-02d
    revision_1_claim: "20 skills never used."
    why_wrong: >
      Counts came from substring matching across the whole ledger file, which also matched skill
      names in the Evidence and "Procedure gap" columns — including skills named as NOT applicable.
      Parsing the Skill column only yields 23 with zero records, and lower counts for most used skills.
    status: CORRECTED
    corrected_to: 23 zero-record skills, classified into 8 groups; no bulk retirement recommended.

  - id: CHG-03
    revision_1_claim: >
      "Propagation succeeds when a decision carries a machine-checkable literal or a blocking
      predicate. It fails when it carries a documentation obligation." — stated as a general law.
    why_wrong: 3 traced cases out of 98 decision entries, non-randomly selected, cannot establish a law.
    status: SOFTENED
    restated_as: A tested pattern across one failure case and two success cases; encoding appears
                 to be the dominant variable. Recommendations do not depend on the stronger claim.

  - id: CHG-04
    revision_1_claim: >
      Launch doctrine "describes the paused program" while the native program has no gates —
      implying web/KVM work was misdirected.
    why_wrong: >
      Founder response FR-A: shared backend, web client, iOS and Android are all active.
      KVM1/Docker/API-health gating is correct and should continue.
    status: REFRAMED
    restated_as: Launch doctrine never gained a PARALLEL set of native-client and store-readiness
                 gates after the native pivot. The web gates are not wrong; they are incomplete.

  - id: CHG-05
    revision_1_claim: Absence of a second live product cuts against a company layer.
    why_wrong: That is an argument about timing, not architectural correctness.
    status: CLARIFIED
    restated_as: Defer. Revisit when multiple products or divisions create a concrete governance
                 requirement. The question is not settled.

  - id: CHG-06
    revision_1_claim: "Slops OS is a well-designed operating system specification with no kernel."
    why_wrong: The same document calls agent-modules/ a doctrine kernel. One metaphor, two meanings.
    status: CLARIFIED
    restated_as: Strong DOCTRINE kernel present; EXECUTABLE GOVERNANCE kernel absent.

  - id: CHG-07
    revision_1_claim: "Exactly one machine-checkable governance artifact."
    why_wrong: Too broad — the repo holds tests, CI workflows, a prompt-guard eval, and a quality baseline.
    status: NARROWED
    restated_as: probo.yaml is the only explicit STRUCTURED GOVERNANCE-CONTROL MAP. Not the only
                 machine-readable or automatically-testable artifact.

  - id: CHG-08
    revision_1_claim: "Every other defect is downstream of decision identity."
    why_wrong: Physical repository hygiene is an independent failure class with an independent cause.
    status: SOFTENED
    restated_as: Three failure classes — decision-truth, orchestration, physical hygiene. Decision
                 identity is highest-leverage because it corrupts future work, not because it causes the others.

  - id: CHG-09
    revision_1_claim: "Tier 4 is that kernel, and it is one script."
    why_wrong: Presents a proposed simplification as a proven final architecture.
    status: SOFTENED
    restated_as: A validator may be the first executable enforcement component. It does not by
                 itself complete the kernel; it depends on decision schema, truth generation,
                 repo inspection, routing, and evidence definitions.

# ---------------------------------------------------------------------------
# FOUNDER-RATIFIED DIRECTION (2026-07-29) — planning authorization only
# ---------------------------------------------------------------------------
founder_response:
  authorizes: planning-and-correction-only
  does_not_authorize: implementation

  product_activity_boundaries:
    shared_backend_platform: ACTIVE
    web_client_feature_work: ACTIVE_AS_NEEDED
    web_maintenance_security: ACTIVE_AS_NEEDED
    ios_client: ACTIVE
    android_client: ACTIVE
    consequence: >
      KVM1, Docker, API health, provider integrations, authentication, databases, caching and
      shared recommendation services remain active because they support the shared platform.
      The audit finding is NOT that backend or web deployment work was unnecessary. The finding
      is that launch-readiness doctrine stayed centred on the web/KVM program and never added
      separate native-client and store-readiness evidence after the native pivot.
    do_not_say: web client is paused or abandoned

  decision_identity_model:
    name: Hybrid + Time
    permanent_id: {form: "DEC-YYYYMMDD-NNN", mutable: false}
    human_key: {form: "SCOPE.DOMAIN.TOPIC", mutable: true}
    classification: {form: "Layer.Group.Item", optional: true, mutable: true}
    graphify_node_identity: permanent_id
    graphify_display_label: human_key
    rule: The permanent ID must not change if the decision moves between categories or layers.
    implementation_status: NOT_AUTHORIZED

  minimum_enforcement:
    name: Truth Gate
    mode: read-only
    built_on: existing repository-inspection capability
    runs_at: [before-planning-or-execution, before-work-is-closed]
    intended_coverage: [repository-truth, decision-schema-validity, active-decision-conflicts,
                        sprint-and-queue-validity, skill-and-routing-integrity, completion-evidence]
    rollout: [report-only, block-proven-critical-failures, local-and-CI-after-validation]
    approved: direction-only
    implementation_status: NOT_AUTHORIZED
    requires_design: [technical-design, invocation-points, failure-taxonomy, block-warn-thresholds]

  agent_session_protocol:
    stages: [DISCUSS, PROPOSE, RATIFY, EXECUTE]
    default_stage: DISCUSS
    rules:
      - Casual founder conversation is not automatically doctrine.
      - PROPOSE structures a candidate decision but does not approve it.
      - RATIFY records an approved decision and identifies what it supersedes and governs.
      - EXECUTE requires approved task, repository truth, permissions, and governing decisions.
    implementation_status: NOT_AUTHORIZED

