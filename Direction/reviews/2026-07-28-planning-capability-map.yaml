# ---------------------------------------------------------------------------
# TRACEABILITY TESTS — 3 of 98 decision entries, non-random selection
# ---------------------------------------------------------------------------
traceability_tests:
  sample_size: 3
  population: 98
  sampling: non-random — selected for ratified + cross-disciplinary + recent
  claim_strength: tested pattern, not proven law

  cases:
    - id: T1
      name: Font stack lock — Cinzel/Inter not revived
      decided: 2026-07-19
      result: FAILED
      encoding: documentation-obligation
      stages: {decision_record: present, repository_truth: BREAK, planning_constraints: partial,
               sprint_requirements: present, execution_handoff: BREAK, verification_criteria: BREAK,
               launch_evidence: not_applicable}
      disciplines_inherited: 2
      disciplines_total: 7
      evidence:
        - "component-lock-v1.md:203-209 still lists Cinzel/Inter (re-verified 2026-07-29)"
        - "omen/CLAUDE.md:26 still calls that file 'canonical component API/tokens'"
        - "done/design-done.md gate 10 still says 'Focus rings visible, gold accent' — contradicting a sibling decision"
        - 3 downstream briefs hit the contradiction and were told not to fix it
      caveat: "The same decision DID propagate correctly into 5 mobile specs — encoding shapes probability, it does not determine outcome."

    - id: T2
      name: "Custom URL scheme com.slopssaloon.omen://"
      decided: 2026-07-19
      result: PASSED
      encoding: machine-checkable-literal
      evidence: 12 markdown references plus source
      caveat: Partly self-proving — a broken literal breaks the build, so survival is expected.

    - id: T5
      name: AI_PROVIDER cloud cap = $0
      decided: 2026-07-12
      result: PASSED
      encoding: blocking-predicate + negative-constraint
      artifacts_in_chain: 9
      drift: none
      span_days: 15
      evidence: >
        Carried "DO NOT BUILD until the cap is logged" and "must hard-fail or stay disabled".
        Closeout explicitly refused to overclaim: "implemented work, not deployment proof".

traceability_finding: >
  Encoding appears to be the dominant variable in whether a ratified decision survives downstream.
  The one tested documentation-obligation case failed; both tested self-enforcing cases succeeded.
  This is a strong pattern across 3 of 98 entries, not a proven law — 95 entries were not traced,
  and T1 itself propagated correctly into 5 of 6 target files. The recommendations do not depend
  on the stronger claim.

# ---------------------------------------------------------------------------
# FIVE-STATE LAUNCH READINESS
# ---------------------------------------------------------------------------
capability_states:
  - state: DESIGNED
    status: partial
    evidence: No design-contract-done.md type exists; an agent invented the category inline in a ledger cell.
  - state: IMPLEMENTED
    status: present
    evidence: "done/feature-done.md, 20 gates."
  - state: PROVISIONED
    status: ABSENT
    severity: high
    approval: ACCEPTED_DIRECTION
    evidence: >
      No Done file has a provisioning gate. Live example: the Apple OAuth secret "expires after six
      months; the founder must rotate it before 2027-01-19" — no artifact tracks that date as a task.
      Nothing asks whether a credential, DNS record, env var, or webhook exists in the target environment.
  - state: VERIFIED
    status: excellent
    evidence: "Degraded-verification doctrine (SUBSTITUTED / DEFERRED-CI), honest downgrades, hard-blocked Release Done."
  - state: VALIDATED_IN_PRODUCTION
    status: defined-never-entered
    evidence: "slops-product-pulse is 'required post-live cadence' with 0 invocation records in 345 ledger rows."

# ---------------------------------------------------------------------------
# VENDOR COUPLING
# ---------------------------------------------------------------------------
vendor_coupling:
  L0: {binding_lines: ~50, capability_neutral_lines: 6, files_affected: 11}
  migration_status: partially-migrated
  migrated: ["agent-modules/", "kickoff-modules/", facts-of-record.md, L2 lane labels,
             "omen/Direction/sprints_completed.md", "SKILL_ROUTING ux-ui-build-pipeline row"]
  not_migrated: ["tools/tool-permissions.md", "tools/TOOLS_INDEX.md", "agents/agents.md",
                 "agents/AGENT_INDEX.md", "agents/layer-handoff-protocol.md", "workflows/",
                 "playbooks/runbook_ai_workflow.md", "prompts/_templates/", SLOPS_LIFECYCLE.md,
                 kickoff filenames, "L2 root AGENT.md", "L2 Direction/context.md",
                 handoffs contract bus, "jules/ handoff dir"]
  deepest_couplings:
    - "kickoff filenames are vendor-keyed (kickoff-frontend-claude.md) — a third runtime cannot start a session without a new file"
    - "the contract bus is named by vendor pairing (frontend-to-backend.md = Claude->Codex)"
    - "RBAC tiers 4-5 are 'Codex only' — bash, tests, builds, commits, pushes vendor-gated in written policy"
    - "a permission boundary is keyed to vendor identity (Jules) rather than to a capability or trust tier"
    - "the Android SDK path in a DoD substitution is defined relative to one vendor's sandbox"
  best_existing_counter_example:
    file: Blueprints/skills/SKILL_ROUTING.md
    row: ux-ui-build-pipeline
    text: >
      "Stage 3 (Build) runs on whichever capable coding agent is doing the work — Codex, Claude,
      Cursor, or another — as long as it follows the pipeline's gates"
    note: Dated 2026-07-09. Exactly the target state, already written down. Undercut only by that skill not existing on disk.
  note: >
    Coupling is nowhere capability-derived. No file says "the runtime with terminal access does X".
    A third runtime has no rule to inherit — it must be added by name in ~50 places across 11 files.
    identity-cowork.md demonstrates the cost: adding one VARIANT of Claude required a new module,
    and Cowork still does not appear in AGENT_INDEX.md, TOOLS_INDEX.md, or tool-permissions.md.
    L2 already routes to THREE agents (Jules, Codex, Claude) while facts-of-record enumerates two.
  verdict: MODIFY
  recommended_change: >
    Rekey the subject, not the constraint. RBAC, approval gates, security and auditability must not
    weaken — rename "Codex only" to a capability + trust-tier requirement, rename kickoffs and the
    contract bus to role names, and convert the Jules constraints into an inheritable trust tier.
  priority: tier-1
  approval: ACCEPTED_DIRECTION

# ---------------------------------------------------------------------------
# THE ONE CREATE — direction accepted, implementation NOT authorized
# ---------------------------------------------------------------------------
create_recommendations:
  - id: truth-gate-validator
    layer: 0
    approval: ACCEPTED_DIRECTION
    implementation_status: NOT_YET_AUTHORIZED
    requires_design: [technical-design, invocation-points, failure-taxonomy, block-warn-thresholds]
    founder_framing: FR-C — a read-only Truth Gate, report-only first
    invoked_by: skill.slops-repo-inspector
    pattern_precedent: "omen/probo.yaml (evidence_path + check: contains(...))"
    intended_coverage: [repository-truth, decision-schema-validity, active-decision-conflicts,
                        sprint-and-queue-validity, skill-and-routing-integrity, completion-evidence]
    rollout: [report-only, block-proven-critical-failures, local-and-CI-after-validation]
    would_have_caught:
      - "~58 broken pointers across L0 and L1"
      - both L1 index files broken
      - "the 2026-07-18 handoff's three dead lane paths"
      - "the L1 facts-of-record self-pointer (6 L1 docs asserting a paid product)"
      - 6 divergent test counts
      - "47-vs-36 wrapper census drift"
      - "'Corvus' in the ## Active Decisions block, 5 weeks running"
      - "2 phantom skills carrying 24 invocation records"
      - "2 registry-only skills marked active"
      - "quality/baseline.json duplicate-key silent downgrade"
      - "local main 20 commits behind origin/main"
    would_NOT_have_caught:
      - "the worktree assessment error — that required knowing the audit's own sandbox was lying"
      - judgment calls about layer membership or doctrine correctness
    why_not_orchestration: >
      Doctrine has already been tried on this exact problem three times and lost: hard-prohibitions.md
      #2 ("don't claim work was done without evidence"), definition-of-done.md (which names its own
      5-day ledger failure), and agent_inbox.md (which instructs agents to distrust handoffs and grep
      main). All three are correct. All three still require a human to notice. The 2026-07-28
      reconciliation happened because a GitHub billing hold forced it, not because anything checked.
    complexity_budget: >
      Removes more than it adds: replaces manual reconciliation passes, retires the need for periodic
      audits like this one, and is the precondition for safely retiring stale documents.
    honest_limit: >
      CHG-09. A validator is a plausible FIRST executable enforcement component. It does not by itself
      complete the kernel — it depends on structured decision records (FR-B), current-truth generation,
      repository inspection, routing, workflow invocation, and evidence definitions.
